name: Schedule Run

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

env:
  APT_PKGS_PATH: '${{ github.workspace }}/apt_pkgs.txt'

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    env:
      config: ${{ secrets.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore config
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          CONFIG_URL: ${{ secrets.config }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then
            echo "$CONFIG_JSON" > config.json
            echo "✅ Created config.json from CONFIG_JSON secret"
          elif [ -n "$CONFIG_URL" ]; then
            curl -s -o config.json "$CONFIG_URL"
            echo "✅ Downloaded config.json from config URL secret"
          else
            echo "⚠️ No config secret found!"
          fi


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Get required apt packages
        id: get-pkgs
        shell: bash
        run: echo "pkgs=$( tr '\n' ' ' <'${{ env.APT_PKGS_PATH }}' )" > "$GITHUB_OUTPUT"

      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ steps.get-pkgs.outputs.pkgs }}
          version: ${{ hashFiles(env.APT_PKGS_PATH) }}
          execute_install_scripts: true

      - uses: extractions/setup-just@v2

      - name: Install deps
        run: uv sync

      - name: Run cpn-cli
        run: uv run cpn-cli | tee /tmp/cpn_output.log

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x .github/scripts/send_telegram.sh
          .github/scripts/send_telegram.sh /tmp/cpn_output.log
